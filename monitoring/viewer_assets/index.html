<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FloodGuard Station Data Store</title><link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script></head>
<body>
<header class="app-header"><div><strong>FloodGuard</strong><span>Station Data Store</span></div><span class="badge">Read-only</span><button id="open-diagram" type="button">Schema Diagram</button><button id="refresh" type="button">Refresh</button></header>
<div class="workspace"><aside><label for="table-filter">Tables</label><input id="table-filter" type="search" placeholder="Find a table"><label for="nav-order">Table order</label><select id="nav-order"><option value="grouped">Grouped</option><option value="database">Database schema order</option></select><nav id="table-nav" aria-label="Database tables"></nav></aside>
<main><div id="error" role="alert" hidden></div><section id="overview"><header class="section-header"><h1>Stored Station Data</h1><span id="database-name"></span></header><div id="summary" class="summary"></div><div id="groups"></div></section>
<section id="diagram-view" hidden><header class="section-header"><div><button id="diagram-back" type="button">Back to overview</button><h1>Database Schema</h1></div><span id="diagram-count"></span></header><div class="toolbar"><button id="diagram-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">-</button><output id="diagram-zoom"></output><button id="diagram-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button><button id="diagram-fit" type="button">Fit</button><button id="diagram-reset" type="button">100%</button><label><input id="diagram-fields" type="checkbox" checked> Fields</label><select id="diagram-focus" aria-label="Focus table"><option value="">All tables</option></select></div><div id="schema-canvas" tabindex="0" aria-label="Database relationship diagram"><div id="schema-scene"></div></div></section>
<section id="table-view" hidden><header class="section-header"><div><button id="back" type="button">Back to overview</button><h1 id="table-title"></h1></div><span id="table-count"></span></header>
<div class="tabs" role="tablist"><button role="tab" id="data-tab" aria-selected="true" aria-controls="data-panel">Records</button><button role="tab" id="raw-tab" aria-selected="false" aria-controls="data-panel">Raw Table</button><button role="tab" id="schema-tab" aria-selected="false" aria-controls="schema-panel">Fields &amp; Relationships</button></div>
<section id="data-panel" role="tabpanel" aria-labelledby="data-tab"><div class="toolbar"><input id="record-search" type="search" aria-label="Search records" placeholder="Search records"><label>Rows <select id="page-size"><option>25</option><option>50</option><option>100</option></select></label><label id="raw-order-control" hidden>Order <select id="row-order"><option value="primary">Primary key</option><option value="rowid">SQLite rowid</option></select></label><span id="page-status"></span><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div><div id="records" class="table-scroll"></div></section>
<section id="schema-panel" role="tabpanel" aria-labelledby="schema-tab" hidden><h2>Fields</h2><div id="fields" class="table-scroll"></div><h2>Relationships</h2><div id="relationships"></div><h2>Indexes</h2><div id="indexes"></div></section></section></main></div>
<dialog id="row-dialog"><header><h2>Record Details</h2><button id="close-dialog" type="button">Close</button></header><dl id="row-details"></dl></dialog>
</body></html>
